
# #######################################################################################
# AUTOGENERATED HYPR CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hypr.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/Configuring-Hyprland/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf

################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=DP-1,1920x1080@239.76Hz,0x0,1
monitor=HDMI-A-2,1920x1080@60hz,1920x0,1
monitor=HDMI-A-1,1920x1080@60.00Hz,-1080x0,1,transform,1
monitor=,preferred,auto,1

#################
### MY PROGRAMS ###
###################

$terminal = kitty
$fileManager = thunar
$menu = wofi --show drun
$browser = firefox
$editor = code
$locker = wlogout
$screenshot = slurp | grim -g - /home/skull/Pictures/Screenshots/screenshot-$(date +"%Y-%m-%d-%H-%M-%S").png
$picker = hyprpicker -a
$gamemode = ~/.config/hypr/gamemode.sh
$mumblestarttalking = mumble rpc starttalking
$mumblestoptalking = mumble rpc stoptalking
$flux = hyprsunset

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox
exec-once = hyprpaper & thunar --daemon & hypridle


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 3
    gaps_out = 12

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    # col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.active_border = rgba(f9141bee) rgba(20488fee) 45deg
    # col.inactive_border = rgba(595959aa)
    col.inactive_border = rgba(f9141b44) rgba(20488f44) 45deg

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = true

    layout = dwindle

    # no_border_on_floating = false
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 8

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        range = 12
        render_power = 6
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    # blur {
    #     enabled = true
    #     size = 3
    #     passes = 1

    #     vibrancy = 0.1696
    # }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    # animation = NAME, ONOFF, SPEED, CURVE [,STYLE]
    animation = windows, 1, 2, myBezier
    animation = windowsOut, 1, 2, default, popin 60%
    animation = border, 1, 2, default
    animation = borderangle, 1, 2, default
    animation = fade, 1, 2, default

    animation = windows, 1, 2, myBezier
    animation = windowsOut, 1, 2, default, popin 60%
    animation = border, 1, 2, default
    animation = borderangle, 1, 2, default
    animation = fade, 1, 2, default
    animation = workspaces, 1, 2, default
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    middle_click_paste = false
    force_default_wallpaper = 1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input

input {
    kb_layout = us
    kb_variant = altgr-intl
    kb_model =
    kb_options = compose:rctrl
    kb_rules =
    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {

}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


####################
### KEYBINDINGSS ###
####################
$mod = SUPER # Sets "Windows" key as main modifier

# Launch apps
bindr = $mod, SUPER_L, exec, pkill wofi || $menu
bind = $mod, T, exec, $terminal
bind = $mod, Y, exec, $browser
bind = $mod, E, exec, $fileManager
bind = $mod, R, exec, $editor
bind = $mod, A, exec, $audio
bind = , Print, exec, $screenshot
bind = $mod SHIFT, C, exec, $picker
bind = $mod, F1, exec, $gamemode
bind = $mod SHIFT, Page_Down, exec, pkill $flux || $flux -t 1000 -g 50

bind = $mod, C, killactive,
bind = $mod, V, togglefloating,
bind = $mod, P, pseudo, # dwindle
bind = $mod, J, layoutmsg, togglesplit # dwindle
bind = $mod SHIFT, F, togglefloating,
bind = $mod, F, fullscreen, 1
bind = $mod, L, exec, pkill $locker || $locker

# Move window in a direction
bind = SUPER CTRL, left, movewindow, l
bind = SUPER CTRL, down, movewindow, d
bind = SUPER CTRL, up, movewindow, u
bind = SUPER CTRL, right, movewindow, r

# Move window to monitor
# bind = $mod SHIFT, left, movewindow, mon:DP-2
# bind = $mod SHIFT, C, movewindow, mon:DP-1
# bind = $mod SHIFT, right, movewindow, mon:HDMI-A-2

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Media keys
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 3%+ && swayosd-client --output-volume raise
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 3%- && swayosd-client --output-volume lower
bindel = ,XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindel = ,XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
bindl=, XF86AudioPlay, exec, playerctl play-pause
bindl=, XF86AudioPrev, exec, playerctl previous
bindl=, XF86AudioNext, exec, playerctl next

# Move focus with mainMod + arrow keys
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mod, code:10, workspace, 1
bind = $mod, code:11, workspace, 2
bind = $mod, code:12, workspace, 3
bind = $mod, code:13, workspace, 4
bind = $mod, code:14, workspace, 5
bind = $mod, code:15, workspace, 6
bind = $mod, code:16, workspace, 7
bind = $mod, code:17, workspace, 8
bind = $mod, code:18, workspace, 9
bind = $mod, code:19, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mod SHIFT, code:10, movetoworkspace, 1
bind = $mod SHIFT, code:11, movetoworkspace, 2
bind = $mod SHIFT, code:12, movetoworkspace, 3
bind = $mod SHIFT, code:13, movetoworkspace, 4
bind = $mod SHIFT, code:14, movetoworkspace, 5
bind = $mod SHIFT, code:15, movetoworkspace, 6
bind = $mod SHIFT, code:16, movetoworkspace, 7
bind = $mod SHIFT, code:17, movetoworkspace, 8
bind = $mod SHIFT, code:18, movetoworkspace, 9
bind = $mod SHIFT, code:19, movetoworkspace, 10

# Focus previous workspace
bind = SUPER,TAB,workspace,previous

# Example special workspace (scratchpad)
bind = $mod, S, togglespecialworkspace, magic
bind = $mod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Global Keybinds
bind = CTRL, F5, pass, class:^(com\.obsproject\.Studio)$
bind = CTRL, F6, pass, class:^(com\.obsproject\.Studio)$
bind = CTRL SHIFT, F6, pass, class:^(com\.obsproject\.Studio)$

# Night light / flux
# bind= $mod ,Up,exec,busctl --user -- call rs.wl-gammarelay / rs.wl.gammarelay UpdateTemperature n -500
# bind= $mod ,Down,exec,busctl --user -- call rs.wl-gammarelay / rs.wl.gammarelay UpdateTemperature n +500

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

windowrule {
  name = windowrule-1
  float = on
  size = 800 600
  match:class = thunar
}


windowrule {
  name = windowrule-2
  float = on
  match:class = mediainfo-gui
}

windowrule {
  name = windowrule-3
  float = on
  match:class = galculator
}


windowrule {
  name = windowrule-4
  monitor = DP-1
  content = game
  fullscreen_state = 3 3
  size = 1920 1080
  rounding = 0
  border_size = 0
  no_shadow = on
  no_blur = on
  no_anim = on
  keep_aspect_ratio = on
  immediate = on
  match:class = OxygenNotIncluded
}


windowrule {
  name = windowrule-5
  monitor = DP-1
  content = game
  fullscreen_state = 3 3
  size = 1920 1080
  rounding = 0
  border_size = 0
  no_shadow = on
  no_blur = on
  no_anim = on
  keep_aspect_ratio = on
  immediate = on
  match:class = steam_app_690790
}
